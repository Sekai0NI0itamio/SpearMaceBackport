name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Set up Gradle 4.9 (ForgeGradle 2.3 needs Gradle 4.x; no wrapper jar in repo)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "4.9"

      - name: Validate project configuration
        run: |
          test -f settings.gradle || (echo "settings.gradle missing" && exit 1)
          test -f build.gradle || (echo "build.gradle missing" && exit 1)
          test -f src/main/resources/mcmod.info || (echo "mcmod.info missing" && exit 1)

      - name: Build with system Gradle (cloud-only; never build locally per repo rule)
        run: gradle build --no-daemon --warning-mode all

      - name: Confirm the mod JAR exists and is non-empty
        if: always()
        run: |
          echo "=== build/libs ==="
          ls -la build/libs/ || (echo "build/libs missing: compilation did not produce output" && exit 1)
          JAR_FOUND=0
          for jar in build/libs/spearmacebackport-*.jar; do
            [ -e "$jar" ] || continue
            case "$jar" in
              *-sources.jar) echo "source jar: $jar ($(stat -c%s "$jar") bytes)" ;;
              *) echo "mod jar: $jar ($(stat -c%s "$jar") bytes)"; JAR_FOUND=1
                 test -s "$jar" || (echo "FAIL: mod JAR is empty: $jar" && exit 1) ;;
            esac
          done
          [ "$JAR_FOUND" = "1" ] || (echo "FAIL: expected mod JAR build/libs/spearmacebackport-*.jar not found" && exit 1)
          echo "JAR validation passed."

      - name: Upload mod JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spearmacebackport-jar
          path: build/libs/*.jar
          if-no-files-found: error
